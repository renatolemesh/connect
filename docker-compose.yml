########################################################################
# Compose base, comum a qualquer instalacao.
#
# Tudo que difere entre uma instalacao e outra vem do .env da propria pasta,
# entao este arquivo pode ser versionado: um `git pull` propaga melhorias para
# todas de uma vez, sem copia manual e sem credencial em texto puro. O que for
# especifico de uma instalacao vai em docker-compose.override.yml, que o compose
# le sozinho e o .gitignore ignora.
#
# A porta NAO precisa estar no CMD da imagem: config/puma.rb ja faz
# `port ENV.fetch('PORT', 3000)`. Basta definir APP_PORT no .env.
#
# As migrations foram tiradas do boot de proposito: com muitas pendentes o
# container ficaria indisponivel durante a migracao, e web e worker subindo
# juntos tentariam migrar ao mesmo tempo. Rodar como passo explicito:
#   docker compose run --rm web bundle exec rails db:migrate
#
# Nao ha servico de banco aqui: POSTGRES_HOST no .env aponta para onde ele
# estiver.
########################################################################

x-app-env: &app-env
  SECRET_KEY_BASE: ${SECRET_KEY_BASE}
  CHATWOOT_BASE_URL: ${CHATWOOT_BASE_URL}
  FRONTEND_URL: ${FRONTEND_URL}
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  CHATWOOT_HUB_URL: ${CHATWOOT_HUB_URL:-https://oriondesign.art.br/setup#}
  FRONTEND_APP_TITLE: ${BRAND_NAME:-Connect}
  BRAND_NAME: ${BRAND_NAME:-Connect}
  INSTALLATION_NAME: ${BRAND_NAME:-Connect}
  DISPLAY_MANIFEST: ${DISPLAY_MANIFEST:-false}
  ENABLE_ACCOUNT_SIGNUP: ${ENABLE_ACCOUNT_SIGNUP:-false}
  DB_POOL: ${DB_POOL:-25}
  DB_TIMEOUT: ${DB_TIMEOUT:-30000}
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-30}
  POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}
  POSTGRES_USERNAME: ${POSTGRES_USERNAME}
  POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD}
  POSTGRES_DATABASE: ${POSTGRES_DATABASE}
  REDIS_URL: redis://:${REDIS_PASSWORD}@${STACK_PREFIX}-redis:${REDIS_PORT}

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  redis:
    image: redis:alpine
    container_name: ${STACK_PREFIX}-redis
    restart: always
    networks: [shared-net]
    # Antes de subir, confere o AOF e corrige se estiver invalido.
    #
    # Em 19/10/2026 o servidor parou de forma abrupta e deixou lixo no fim do AOF da
    # Xpertion. O Redis recusou subir ("Bad file format") e rails e sidekiq ficaram em
    # loop atras dele por 1h26. `aof-load-truncated`, que ja vem ligado, so trata
    # arquivo cortado, nao lixo no fim. O conserto e o mesmo feito a mao naquele dia:
    # redis-check-aof --fix, que corta no ultimo comando valido. Antes, o estado
    # corrompido e copiado para fora de /data, para dar para investigar depois - dentro
    # de /data ele faria o entrypoint parar de corrigir permissoes para sempre.
    #
    # O redis-server sobe pelo docker-entrypoint.sh e com `exec`: e o entrypoint que
    # baixa o privilegio para o usuario redis e carrega os modulos, e o exec deixa o
    # Redis como PID 1, recebendo o SIGTERM do `docker stop` para fechar o AOF limpo.
    # Os argumentos vao em "$$@", fora do texto do shell, para a senha nunca ser
    # interpretada por ele.
    command:
      - sh
      - -c
      - |
        M=/data/appendonlydir/appendonly.aof.manifest
        if [ -f "$$M" ] && ! redis-check-aof "$$M" >/dev/null 2>&1; then
          B="/aof-corrompido/$$(date +%Y%m%d-%H%M%S)"
          echo "AOF invalido: guardando copia em $$B e corrigindo"
          mkdir -p "$$B" && cp -a /data/appendonlydir "$$B/"
          echo y | redis-check-aof --fix "$$M"
        fi
        exec docker-entrypoint.sh redis-server "$$@"
      - sh
      - --requirepass
      - ${REDIS_PASSWORD}
      - --port
      - ${REDIS_PORT}
      - --appendonly
      - "yes"
    volumes:
      - ./docker_data/redis:/data
      - ./docker_data/redis-aof-corrompido:/aof-corrompido
    ports:
      - '127.0.0.1:${REDIS_PORT}:${REDIS_PORT}'
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    mem_reservation: ${REDIS_MEM_RESERVATION:-128m}
    memswap_limit: ${REDIS_MEMSWAP_LIMIT:-256m}
    logging: *logging

  web:
    # `docker compose build` gera e taggeia como APP_IMAGE; `up` so constroi se
    # a imagem ainda nao existir.
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_HEAP_MB: ${NODE_HEAP_MB:-4096}
    image: ${APP_IMAGE}
    container_name: ${STACK_PREFIX}-rails
    depends_on: [redis]
    env_file: .env
    environment:
      <<: *app-env
      PORT: ${APP_PORT}
      FORCE_SSL: "true"
      RAILS_FORCE_SSL: "true"
    entrypoint: docker/entrypoints/rails.sh
    command: ['bundle', 'exec', 'rails', 's', '-b', '0.0.0.0']
    ports:
      # O nginx fala com o container pela shared-net; esta porta e so
      # conveniencia local. Manter em 127.0.0.1 evita sondagem TLS da
      # internet batendo direto no Puma, sem passar pelo nginx.
      - '${APP_BIND:-127.0.0.1}:${APP_PORT}:${APP_PORT}'
    volumes:
      - ./docker_data/storage:/app/storage
    networks: [shared-net]
    restart: unless-stopped
    mem_limit: ${WEB_MEM_LIMIT:-1536m}
    mem_reservation: ${WEB_MEM_RESERVATION:-768m}
    memswap_limit: ${WEB_MEMSWAP_LIMIT:-2048m}
    logging: *logging

  worker:
    # Uma instalacao que nao deva processar jobs -- por exemplo uma que rode
    # sobre copia de dados, onde o Sidekiq dispararia webhooks e mensagens de
    # verdade -- desliga este servico pelo docker-compose.override.yml.
    image: ${APP_IMAGE}
    container_name: ${STACK_PREFIX}-sidekiq
    depends_on: [redis]
    env_file: .env
    environment:
      <<: *app-env
    working_dir: /app
    command: ['bundle', 'exec', 'sidekiq', '-C', 'config/sidekiq.yml']
    volumes:
      - ./docker_data/storage:/app/storage
    networks: [shared-net]
    restart: always
    mem_limit: ${WORKER_MEM_LIMIT:-1280m}
    mem_reservation: ${WORKER_MEM_RESERVATION:-640m}
    memswap_limit: ${WORKER_MEMSWAP_LIMIT:-1792m}
    logging: *logging

networks:
  shared-net:
    external: true
